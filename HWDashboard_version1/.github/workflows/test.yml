name: Question Engine Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run question engine tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Run question engine tests
        run: |
          python test_questions.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Question engine tests failed. Check test_questions.py output above before deploying."
